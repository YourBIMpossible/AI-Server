# Optional containerized runtime — handy on the 3090 box (Ubuntu + Docker).
# Requires the NVIDIA Container Toolkit on the host for GPU access.
# Start:  docker compose up -d
# Pull a model:  docker compose exec ollama ollama pull qwen2.5-coder:32b
#
# This file deploys ONE runner (Ollama, the current baseline). Clients never know that:
# they only see INFERENCE_BASE_URL pointing at the OpenAI-compatible surface below, so a
# different runner is a different service block here, not a change in the application.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-server-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"          # in production, bind to your LAN/Tailscale interface only
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Server-side bind address. NOT the client setting -- clients use INFERENCE_BASE_URL.
      - OLLAMA_HOST=0.0.0.0:11434
      # Serving layer. These are worth up to ~150x on prefill and they default to OFF /
      # 4096 tokens, which silently truncates a 27k-token prompt. Keep in step with
      # scripts/setup-linux.sh, and verify from the server's startup banner, not the shell.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
    # Health is defined as "the portable contract answers", not "the Ollama process is
    # alive" -- the same check a replacement runner has to pass.
    #
    # Verified 2026-09-11 against ollama/ollama:latest (sha256:684d8674b431): the image ships
    # NO curl and NO wget, so a curl healthcheck reports a perfectly healthy container as
    # unhealthy, forever. It does ship bash, head and grep -- hence /dev/tcp. A replacement
    # runner image needs its own equivalent of this same GET; check what it actually
    # contains before assuming curl is there.
    #
    # Folded scalar, not a quoted string: YAML double-quoting would expand the CRLF escapes
    # into real newlines before printf ever saw them.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/11434 &&
          printf 'GET /v1/models HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '200 OK'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  ollama-models:
